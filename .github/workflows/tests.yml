
name: GOLD BOT - Automated Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      run_live_ntp_check:
        description: "Run live UDP 123 NTP connectivity check"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: gold-bot-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python and NTP Unit Tests
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run NTP verifier unit tests
        run: python -m pytest -v tests/test_ntp_time.py

      - name: Run complete test suite
        run: python -m pytest -q

  live-ntp:
    name: Live NTP UDP 123 Verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_ntp_check == true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run live NTP verification
        run: |
          python - <<'PY'
          from backend.market_data.ntp_time import NtpTimeVerifier

          verifier = NtpTimeVerifier()
          result = verifier.verify()

          print(f"VERIFIED: {result.verified}")
          print(f"SAMPLE_COUNT: {result.sample_count}")
          print(f"OFFSET_SECONDS: {result.offset_seconds}")
          print(f"UNCERTAINTY_SECONDS: {result.uncertainty_seconds}")
          print(f"SERVERS: {result.servers}")
          print(f"ERROR: {result.error}")

          if not result.verified:
              raise SystemExit("Live NTP verification failed.")
          PY
