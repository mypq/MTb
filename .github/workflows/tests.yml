name: GOLD BOT - Automated Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      run_live_ntp_check:
        description: "Run live UDP 123 NTP connectivity check"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: gold-bot-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python and NTP Unit Tests
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run NTP verifier unit tests
        run: python -m pytest -v tests/test_ntp_time.py

      - name: Run broker clock integration test
        run: python -m pytest -vv -s tests/test_broker_clock_integration.py

      - name: Run complete test suite
        run: python -m pytest -vv -s

  live-ntp:
    name: Live NTP UDP 123 Verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_ntp_check == true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NTP test dependencies
        run: python -m pip install "pytest>=8.3,<10"

      - name: Run live NTP UDP 123 verification
        env:
          GOLD_BOT_RUN_LIVE_NTP: "1"
        run: python -m pytest -v -s tests/test_ntp_live.py
